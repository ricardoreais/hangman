<mat-sidenav-container>
    <mat-sidenav mode="side" opened class="sidenav">
        <div class="sidenav-wrapper">
            <div class="sidenav-logo">
                <img class="logo-desktop" src="assets/hangman-logo.svg">
                <img class="logo-mobile" src="assets/hangman-logo-xs.svg">
            </div>
            <mat-nav-list class="sidenav-nav">
                <a mat-list-item routerLink="/user" class="nav-item-center">
                    <mat-icon mat-list-icon>house</mat-icon>
                    <span mat-line class="nav-label">{{ 'home' | translate }}</span>
                </a>
                <a mat-list-item routerLink="/game" *ngIf="userService.IsLogged" class="nav-item-center">
                    <mat-icon mat-list-icon>videogame_asset</mat-icon>
                    <span mat-line class="nav-label">{{ 'game' | translate }}</span>
                </a>
            </mat-nav-list>
            <div class="sidenav-lang">
                <a mat-button class="lang-btn" [routerLink]="" (click)="changeLanguage('en')">EN</a>
                <a mat-button class="lang-btn" [routerLink]="" (click)="changeLanguage('pt')">PT</a>
            </div>
        </div>
    </mat-sidenav>
    <mat-sidenav-content class="sidenav-content">
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
